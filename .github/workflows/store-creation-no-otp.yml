name: store-creation-no-otp

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descodificar alteracao
        shell: python3 {0}
        run: |
          import base64
          import gzip
          from pathlib import Path

          PATCH = ""

          Path("/tmp/homsteg-change.patch").write_bytes(
              gzip.decompress(base64.b64decode(PATCH))
          )

      - name: Aplicar e publicar
        run: |
          git apply --check /tmp/homsteg-change.patch
          git apply /tmp/homsteg-change.patch
          git rm -q .github/workflows/store-creation-no-otp.yml
          git add -A
          git config user.name "homsteg"
          git config user.email "homsteg-bot@users.noreply.github.com"
          git commit -m "feat: criar loja sem verificação de email"
          git push
